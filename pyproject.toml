[project]
name = "bewer"
version = "0.1.0"
description = "Evaluation and analysis framework for automatic speech recognition in Python."
authors = [
    {name = "Lasse Borgholt"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "regex (>=2024.11.6,<2025.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "rapidfuzz (>=3.13.0,<4.0.0)",
    "guidance (>=0.2.1,<0.3.0)",
    "transformers (>=4.51.3,<5.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "accelerate (>=1.6.0,<2.0.0)",
    "llama-cpp-python (>=0.3.8,<0.4.0)",
    "gpustat (>=1.1.1,<2.0.0)",
    "rich (>=14.0.0,<15.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipython = "^9.0.2"
faster-whisper = "^1.1.1"
evaluate = "^0.4.3"
jiwer = "^3.1.0"
werpy = "^3.1.0"
mlflow = "^2.22.0"
ml_datasets = { git = "ssh://git@github.com/corticph/ml-datasets.git", tag = "v0.9.0" }
polars = "^1.29.0"


[tool.poetry]
packages = [{include = "bewer"}]